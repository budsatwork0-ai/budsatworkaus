name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── Unit & type checks ────────────────────────────────────────────────────
  test:
    name: Unit tests & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --testPathIgnorePatterns=integration

  # ── Integration smoke tests (required pre-deploy) ─────────────────────────
  integration-smoke:
    name: Integration smoke — live LLM config
    runs-on: ubuntu-latest
    # Only run on pushes/PRs that target main (pre-deploy gate)
    if: |
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main'
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration smoke tests
        run: npm test -- --testPathPattern=smoke\.integration\.test
